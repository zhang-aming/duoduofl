<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接分类工具</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; color: #222; line-height: 1.6;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 14px; }
  .card {
    background: #fff; border-radius: 12px; padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 14px;
  }
  textarea {
    width: 100%; min-height: 180px; padding: 10px;
    border: 1px solid #ddd; border-radius: 8px; font-size: 13px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    resize: vertical; outline: none;
  }
  textarea:focus { border-color: #4a90e2; }
  .btns { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 120px; padding: 12px 16px;
    border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: opacity .2s;
  }
  button:active { opacity: .7; }
  .primary { background: #4a90e2; color: #fff; }
  .ghost { background: #eef1f6; color: #444; }
  .result-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .stat { font-size: 13px; color: #555; margin-bottom: 10px; }
  .group {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: #f8fafc; border-radius: 8px;
    margin-bottom: 8px; border: 1px solid #e8eef5;
  }
  .group .name { font-weight: 700; color: #2c3e50; font-size: 14px; }
  .group .count { font-size: 12px; color: #888; }
  .group button {
    flex: 0 0 auto; min-width: 0; padding: 8px 14px; font-size: 13px;
    background: #4a90e2; color: #fff; border-radius: 6px;
  }
  .warn { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .hint { font-size: 12px; color: #999; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>🔗 链接分类工具</h1>
<div class="sub">粘贴链接 → 自动按前缀分类 → 一键下载 txt</div>

<div class="card">
  <textarea id="input" placeholder="每行一个链接，例如：
http://f.gzsle.com/062/VXm1aZ8QoaO
http://f.gzsle.com/022/BO8b2PDM8l9
https://d.gzsle.cn/2744MY4FP0Y"></textarea>
  <div class="btns">
    <button class="primary" onclick="doClassify()">开始分类</button>
    <button class="ghost" onclick="clearAll()">清空</button>
  </div>
  <div class="hint">提示：也可以直接从文件里全选复制粘贴进来。</div>
</div>

<div class="card hidden" id="resultCard">
  <div class="result-title">✅ 分类结果</div>
  <div class="stat" id="stat"></div>
  <div id="groups"></div>
  <div class="warn hidden" id="warn"></div>
  <div class="btns">
    <button class="primary" onclick="downloadAll()">⬇ 全部下载</button>
  </div>
</div>

<script>
// ---------------- 分类规则 ----------------
const RULES = [
  {
    re: /^https?:\/\/f\.gzsle\.com\/([^\/?#\s]+)(?:\/|$)/i,
    label: m => m[1]
  },
  {
    re: /^https?:\/\/d\.gzsle\.cn\/([^\/?#\s]+)/i,
    label: () => "d_gzsle_cn"
  }
];

function classifyLink(link) {
  for (const r of RULES) {
    const m = link.match(r.re);
    if (m) return r.label(m);
  }
  return null;
}

// ---------------- 状态 ----------------
let groups = {};   // { 分类名: [链接...] }
let invalid = [];  // [行号, 原行]
let total = 0;

// ---------------- 主逻辑 ----------------
function doClassify() {
  const text = document.getElementById('input').value;
  const lines = text.split(/\r?\n/);

  groups = {};
  invalid = [];
  const seen = new Set();
  total = 0;

  lines.forEach((raw, i) => {
    const link = raw.trim();
    if (!link) return;
    if (seen.has(link)) return;
    seen.add(link);
    total++;

    const cat = classifyLink(link);
    if (cat) {
      (groups[cat] = groups[cat] || []).push(link);
    } else {
      invalid.push([i + 1, raw]);
    }
  });

  renderResult();
}

function renderResult() {
  const card = document.getElementById('resultCard');
  const stat = document.getElementById('stat');
  const box  = document.getElementById('groups');
  const warn = document.getElementById('warn');

  card.classList.remove('hidden');
  box.innerHTML = '';

  const cats = Object.keys(groups).sort();
  stat.textContent = `共 ${cats.length} 个分类，去重后 ${total} 条链接`;

  cats.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'group';
    row.innerHTML = `
      <div>
        <div class="name">${escapeHtml(cat)}</div>
        <div class="count">${groups[cat].length} 条</div>
      </div>
    `;
    const btn = document.createElement('button');
    btn.textContent = '下载';
    btn.onclick = () => downloadFile(`${cat}.txt`, groups[cat].join('\n') + '\n');
    row.appendChild(btn);
    box.appendChild(row);
  });

  if (invalid.length) {
    warn.classList.remove('hidden');
    warn.textContent = `⚠ 有 ${invalid.length} 行无法识别（未出现在上面的分类里）`;
    const row = document.createElement('div');
    row.className = 'group';
    row.innerHTML = `<div><div class="name">_invalid</div><div class="count">${invalid.length} 行</div></div>`;
    const btn = document.createElement('button');
    btn.textContent = '下载';
    btn.onclick = () => downloadFile('_invalid.txt',
      invalid.map(([n, s]) => `${n}\t${s}`).join('\n') + '\n');
    row.appendChild(btn);
    box.appendChild(row);
  } else {
    warn.classList.add('hidden');
  }
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadAll() {
  const cats = Object.keys(groups).sort();
  if (!cats.length) return;
  let i = 0;
  const next = () => {
    if (i >= cats.length) return;
    const cat = cats[i++];
    downloadFile(`${cat}.txt`, groups[cat].join('\n') + '\n');
    // 浏览器对连续下载有频率限制，逐个间隔触发
    setTimeout(next, 300);
  };
  next();
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('resultCard').classList.add('hidden');
  groups = {}; invalid = []; total = 0;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
</script>
</body>
</html>
